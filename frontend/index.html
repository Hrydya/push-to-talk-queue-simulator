<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT MESSENGER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Login Screen -->
    <div class="screen" id="login-screen">
        <h2>Sign In</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="Login()">Sign In</button>
        <button onclick="showRegister()">Register Instead</button>
    </div>

    <!-- Register Screen -->
    <div class="screen" id="register-screen" style="display:none">
        <h2>Create Account</h2>
        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">
        <button onclick="Register()">Register</button>
        <button onclick="showLogin()">Back to Login</button>
    </div>
  
    <!-- Chat Screen -->
    <div class="screen" id="chat-screen" style="display:none">
        <h3>Welcome <span id="my-name"></span>!</h3>
        <div class="speaker-box">
            🎤 <span id="current-speaker">No one</span> is speaking
        </div>
        <button id="talk-btn" onclick="requestTalk()">Request to Talk</button>
        <button id="end-btn" onclick="endTalk()" disabled>End Talk</button>
        <button onclick="logout()">Logout</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
